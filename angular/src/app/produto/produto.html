<mat-form-field appearance="outline" style="margin-left: 20px;">
  <mat-label>Nome do Produto</mat-label>
  <input matInput [(ngModel)]="nome" placeholder="Ex: Teclado Mecânico">
</mat-form-field>

<mat-form-field appearance="outline" style="margin-left: 20px;">
  <mat-label>Preço</mat-label>
  <input matInput [(ngModel)]="preco" placeholder="Ex: 100,00">
</mat-form-field>

<mat-form-field appearance="outline" style="margin-left: 20px;">
  <mat-label>Descrição</mat-label>
  <input matInput [(ngModel)]="descricao" placeholder="Ex: Teclado Mecânico">
</mat-form-field>

<button mat-fab extended color="primary" style="margin-left: 20px;">
    <mat-icon>edit</mat-icon>
    salvar
</button>

 <table mat-table [dataSource]="productList" style="width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 8px;">

    <!-- Coluna ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef style="font-weight: bold; width: 80px;"> ID </th>
      <td mat-cell *matCellDef="let prod"> {{ prod.id }} </td>
    </ng-container>

    <!-- Coluna Nome -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef style="font-weight: bold;"> Nome do Produto </th>
      <td mat-cell *matCellDef="let prod"> {{ prod.nome }} </td>
    </ng-container>

    <!-- Coluna Preço -->
    <ng-container matColumnDef="preco">
      <th mat-header-cell *matHeaderCellDef style="font-weight: bold; width: 150px;"> Preço </th>
      <td mat-cell *matCellDef="let prod"> R$ {{ prod.preco }} </td>
    </ng-container>

    <!-- Coluna Descrição -->
    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef style="font-weight: bold;"> Descrição </th>
      <td mat-cell *matCellDef="let prod"> {{ prod.descricao }} </td>
    </ng-container>

    <!-- Definição das linhas estruturais da tabela (Obrigatório) -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
